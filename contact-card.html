<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us | Chilliwack Children's Dentistry</title>
<meta name="description" content="Contact details for Chilliwack Children's Dentistry: phone, fax, address and map location.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#FBF4E8; color:#3d2a14; font-family:'Nunito Sans',system-ui,sans-serif; font-size:17px; line-height:1.55; }
  img, iframe { max-width:100%; }
  .wrap { max-width:480px; margin:0 auto; min-height:100vh; background:#fff; }

  .site-header { background:#fff; padding:24px 28px; text-align:center; }
  .site-header img { height:52px; width:auto; }

  .banner { background:#738526; padding:22px 28px 40px; text-align:center; }
  .banner .badge { display:inline-block; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); color:#f4f7e4; font-weight:800; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; padding:8px 16px; border-radius:10px; }
  .wave { display:block; width:100%; height:32px; margin-top:-1px; }

  main { padding:8px 24px 40px; }
  h1 { font-family:'Baloo 2',sans-serif; font-weight:800; font-size:26px; line-height:1.15; margin:20px 0 6px; text-align:center; color:#572806; }
  .sub { text-align:center; color:#6b5a42; font-size:15.5px; margin:0 0 28px; }

  .row { display:flex; align-items:center; gap:16px; padding:18px 4px; border-bottom:1px solid #efe9dc; }
  .row:last-of-type { border-bottom:none; }
  .icon { flex:none; width:44px; height:44px; border-radius:12px; background:#EEF2DC; color:#738526; display:grid; place-items:center; font-size:20px; }
  .label { font-family:'Baloo 2',sans-serif; font-weight:700; font-size:13.5px; letter-spacing:.03em; text-transform:uppercase; color:#a8743d; margin:0 0 2px; }
  .value { font-weight:700; color:#3d2a14; font-size:17px; }
  .value a { color:inherit; text-decoration:none; }

  .call-btn { display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; background:#572806; color:#fff; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:19px; padding:17px; border-radius:14px; margin:22px 0 8px; }
  .directions-btn { display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; border:2px solid #572806; color:#572806; font-weight:800; font-size:15px; padding:13px; border-radius:14px; margin:4px 0 24px; }

  .map { width:100%; height:220px; border:none; border-radius:18px; display:block; margin-top:4px; }

  footer { text-align:center; padding:24px; color:#9a917f; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <a href="index.html"><img src="assets/ccd-logo.svg" alt="Chilliwack Children's Dentistry logo"></a>
  </header>
  <div class="banner">
    <div class="badge">Now open and accepting new patients</div>
  </div>
  <svg class="wave" viewBox="0 0 480 32" preserveAspectRatio="none" aria-hidden="true"><path d="M0,32 L0,16 Q120,0 240,16 T480,16 L480,32 Z" fill="#fff"></path></svg>

  <main>
    <h1>Get in touch</h1>
    <p class="sub">Chilliwack Children's Dentistry</p>

    <a class="call-btn" href="tel:7786660703" aria-label="Call (778) 666-0703">
      📞 (778) 666-0703
    </a>

    <div class="row">
      <div class="icon" aria-hidden="true">📠</div>
      <div>
        <div class="label">Fax</div>
        <div class="value">(778) 666-0743</div>
      </div>
    </div>

    <div class="row">
      <div class="icon" aria-hidden="true">📍</div>
      <div>
        <div class="label">Address</div>
        <div class="value">Unit 10-11, 8989 Young Road,<br>Chilliwack, BC V2P 4RP</div>
      </div>
    </div>

    <div class="row">
      <div class="icon" aria-hidden="true">🕐</div>
      <div>
        <div class="label">Hours</div>
        <div class="value">Mon&ndash;Fri, 8 am&ndash;4 pm</div>
      </div>
    </div>

    <a class="directions-btn" href="https://www.google.com/maps/search/?api=1&query=Unit+10-11%2C+8989+Young+Road%2C+Chilliwack%2C+BC+V2P+4RP" target="_blank" rel="noopener">
      Get Directions →
    </a>

    <iframe class="map" title="Map to Chilliwack Children's Dentistry" src="https://www.google.com/maps/embed?origin=mfe&amp;pb=!1m3!2m1!1s8989%20Young%20Road%2C%20Chilliwack%2C%20BC!6i15" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </main>

  <footer>&copy; 2026 Chilliwack Children's Dentistry</footer>

</div>
</body>
</html>
